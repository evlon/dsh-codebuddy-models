# Publishes the package to the public npm registry when a version tag is pushed.
#
# Flow:
#   1. `npm version <patch|minor|major>`   bumps package.json version + tags
#   2. `git push --tags`                   triggers this workflow
#   3. The job installs, builds, tests, and runs `npm publish`
#
# Requires a repository secret named `NPM_TOKEN`:
#   npm token create --read-only   -> but publish needs read-write, so:
#   npm token create               (generate an automation token)
#   -> Settings > Secrets and variables > Actions > New repository secret: NPM_TOKEN
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance / attestation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
